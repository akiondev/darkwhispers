[package]
name = "darkwhispers-addons"
version = "0.1.4"
description = "Install, update and remove DarkWhispers addons."
authors = ["Robin"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
darkwhispers-core = { path = "../crates/addon-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
