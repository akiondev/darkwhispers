name: DarkWhispers App prototype
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darkwhispers-app-build
  cancel-in-progress: false
jobs:
  app:
    if: github.repository == 'akiondev/darkwhispers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Types, focused tests and measured engine benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          npm run check 2>&1 | tee reports/typecheck.txt
          npm test 2>&1 | tee reports/tests.txt
      - name: Dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=moderate --json > reports/npm-audit.json
      - name: Production build
        run: npm run build
      - name: Package app without credentials or developer dependencies
        shell: bash
        run: |
          set -euo pipefail
          tar -czf darkwhispers-app.tar.gz dist package.json package-lock.json deploy docs README.md
          sha256sum darkwhispers-app.tar.gz > reports/SHA256SUMS.txt
          printf '%s\n' "${GITHUB_SHA}" > reports/source-commit.txt
      - name: Attest application and validation reports
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            app/darkwhispers-app.tar.gz
            app/reports/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darkwhispers-app
          path: |
            app/darkwhispers-app.tar.gz
            app/reports/
          if-no-files-found: error
          retention-days: 30
