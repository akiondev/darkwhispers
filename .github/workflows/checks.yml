name: Source checks
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/public/security/**"
      - "website/public/launcher/*.json"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Targeted browser and release validation tests
        run: |
          python ci/prepare.py
          node --test --test-name-pattern="accepts WoW root" website/tests/browser-installer.test.mjs
          python -m unittest discover -s website/tests -p 'test_*.py'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            launcher/target
          key: source-rust-1.99.1-${{ hashFiles('launcher/Cargo.lock') }}
          restore-keys: source-rust-1.99.1-
      - name: Rust core
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cd launcher
          cargo +1.99.1 test --locked -p darkwhispers-core
